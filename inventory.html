<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory | Smart Retail Dashboard System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>Inventory Management</h1>
    <p>Manage your products and track stock value efficiently.</p>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="inventory.html">Inventory</a>
    <a href="sales.html">Sales</a>
  </nav>

  <main>

    <section>
      <h2>Add Product</h2>
      <img src="Amazon Warehouse.jpg" alt="Stock management warehouse" />

      <form id="productForm">
        <label for="productName">Product Name</label>
        <input type="text" id="productName" placeholder="Product name" required />

        <label for="price">Price (KES)</label>
        <input type="number" id="price" placeholder="Price (KES)" required />

        <label for="stock">Stock Quantity</label>
        <input type="number" id="stock" placeholder="Stock quantity" required />

        <button type="submit">Add Product</button>
      </form>

      <p id="productStatus"></p>
    </section>

    <section>
      <h2>Product List</h2>
      <div id="productList"></div>
    </section>

    <section>
      <h2>Inventory Revenue</h2>
      <div id="inventoryRevenue"></div>
    </section>

    <section>
      <h2>Contact Support</h2>
      <p>Need help with inventory? Send us a message below.</p>

      <form id="contactForm">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Your name" required />

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Your email" required />

        <label for="message">Message</label>
        <input type="text" id="message" placeholder="Your message" required />

        <button type="submit">Send Message</button>
      </form>

      <p id="contactStatus"></p>
    </section>

  </main>

  <footer>
    <p>&copy; 2026 Smart Retail Dashboard System. All rights reserved.</p>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
